services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: commerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: ["dragonfly", "--cluster_mode=emulated", "--lock_on_hashtags", "--proactor_threads=1"]
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1

  # PgBouncer in transaction mode, as production runs it in front of Postgres. Only with
  # `docker compose --profile pooling up -d`; the pooling test (packages/db/test) uses it when
  # PGBOUNCER_PORT=6432 is set. Login as the `app` role.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    profiles: ["pooling"]
    environment:
      # No DB_NAME: PgBouncer serves every database (`* = host=postgres`), test copies included.
      DB_HOST: postgres
      DB_USER: app
      DB_PASSWORD: app
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # GlitchTip: self-hosted, Sentry-protocol-compatible error tracking. Never starts with
  # `bun run infra:up`; only with `docker compose --profile observability up -d`. Its own
  # Postgres/Redis, so it never touches the app's `commerce` database.
  # See docs/ops/error-tracking.md.
  glitchtip-postgres:
    image: postgres:17-alpine
    profiles: ["observability"]
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 5s
      timeout: 3s
      retries: 10
  glitchtip-redis:
    image: redis:7-alpine
    profiles: ["observability"]
  glitchtip-migrate:
    image: glitchtip/glitchtip:v4
    profiles: ["observability"]
    command: ./manage.py migrate
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
    environment: &glitchtip-env
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: dev-only-glitchtip-secret-key-change-me
      PORT: "8000"
      GLITCHTIP_DOMAIN: http://localhost:8000
      DEFAULT_FROM_EMAIL: glitchtip@localhost
      CELERY_WORKER_AUTOSCALE: "1,1"
      ENABLE_OPEN_USER_REGISTRATION: "true"
  glitchtip-web:
    image: glitchtip/glitchtip:v4
    profiles: ["observability"]
    ports:
      - "8000:8000"
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    environment: *glitchtip-env
  glitchtip-worker:
    image: glitchtip/glitchtip:v4
    profiles: ["observability"]
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    environment: *glitchtip-env
volumes:
  pgdata:
  glitchtip_pgdata:
