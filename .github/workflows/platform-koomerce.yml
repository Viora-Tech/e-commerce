# Generated by the platform for project koomerce. Builds on GitHub's runners,
# pushes to GHCR, then asks the platform to deploy. Edit in the dashboard, not here.
name: "Deploy koomerce"
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: "platform-koomerce-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  build-storefront:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "."
          file: "apps/storefront/Dockerfile"
          platforms: linux/amd64
          push: true
          tags: "ghcr.io/viora-tech/e-commerce-storefront:${{ github.sha }}"
          cache-from: "type=gha,scope=storefront"
          cache-to: "type=gha,scope=storefront,mode=max"
          provenance: "mode=min"
  build-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "."
          file: "apps/admin/Dockerfile"
          platforms: linux/amd64
          push: true
          tags: "ghcr.io/viora-tech/e-commerce-admin:${{ github.sha }}"
          cache-from: "type=gha,scope=admin"
          cache-to: "type=gha,scope=admin,mode=max"
          provenance: "mode=min"
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions: {}
    needs: [build-storefront, build-admin]
    steps:
      - name: Deploy
        env:
          PLATFORM_DEPLOY_HOOK: ${{ secrets.PLATFORM_DEPLOY_HOOK }}
          SERVICES: '["storefront","admin"]'
        run: |
          set -euo pipefail
          body=$(printf '{"tag":"%s","services":%s}' "$GITHUB_SHA" "$SERVICES")
          curl --fail-with-body -sS --max-time 1900 -X POST -H 'Content-Type: application/json' --data "$body" "$PLATFORM_DEPLOY_HOOK"
