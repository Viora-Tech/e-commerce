# Production compose file for Dokploy, one Lightsail server (Mumbai, 8 GB RAM / 2 vCPU
# burstable, Ubuntu 24.04). Nothing is built on this server: .github/workflows/release.yml
# builds every image in GitHub Actions on each push to `main`, pushes it to GHCR
# (ghcr.io/viora-tech/<app>:<sha> and :latest), then calls Dokploy's deploy webhook. Dokploy
# only pulls these images and restarts. (PR #173 built on the box; building the admin used
# ~7 GB and crashed Docker, so builds moved off it.)
#
# IMAGE_TAG picks which build runs: `latest` by default, or a full commit sha to pin/roll back.
# Every app-image service sets `pull_policy: always` so a redeploy of `latest` actually fetches
# the new build instead of reusing the cached one.
#
# Memory budget (8 GB total): Dokploy + its Traefik proxy ~400 MB, OS ~300 MB, leaving ~7.3 GB.
# The mem_limit values below add up to well under that at steady state, with headroom for
# traffic bursts:
#   postgres 1536M, dragonfly 640M, admin 768M, storefront 768M, worker 384M, backup 256M
#   (mostly idle) = ~4.35 GB steady-state, ~2.95 GB free (migrate is a one-shot 512M that only
#   overlaps this for the seconds it takes to run, before the apps below it start).
#
# See apps/docs/content/developer-docs/operations/deployment.mdx for the full runbook
# (first deploy, domains, rollback, restore) and deploy/env.production.example for every
# variable referenced here.

name: commerce

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_URL_OWNER: ${DATABASE_URL_OWNER}
  # PgBouncer (transaction mode): DATABASE_POOLED=true, and DATABASE_URL_DIRECT for the
  # storefront cache's LISTEN connection. Blank is a direct connection.
  DATABASE_POOLED: ${DATABASE_POOLED:-}
  DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:-}
  REDIS_URL: ${REDIS_URL:-redis://dragonfly:6379}
  AUTH_SECRET: ${AUTH_SECRET}
  ADMIN_URL: ${ADMIN_URL}
  STOREFRONT_URL: ${STOREFRONT_URL}
  NEXT_PUBLIC_WORKER_URL: ${NEXT_PUBLIC_WORKER_URL}
  SETTINGS_SECRET: ${SETTINGS_SECRET}
  SETTINGS_SECRET_PREVIOUS: ${SETTINGS_SECRET_PREVIOUS:-}
  BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
  DOMAIN_PROVIDER: ${DOMAIN_PROVIDER:-dev}
  STOREFRONT_A_RECORD: ${STOREFRONT_A_RECORD:-}
  STOREFRONT_CNAME_TARGET: ${STOREFRONT_CNAME_TARGET:-}
  CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
  # Cloudflare token with only Zone > Cache Purge, used by the worker to purge store pages.
  CLOUDFLARE_CACHE_PURGE_TOKEN: ${CLOUDFLARE_CACHE_PURGE_TOKEN:-}
  PLATFORM_DOMAINS: ${PLATFORM_DOMAINS:-}
  PLATFORM_STORE_DOMAIN: ${PLATFORM_STORE_DOMAIN:-}
  # Worker image jobs at once, and per store; blank uses the defaults (3 and 3). Near the vCPU count.
  MEDIA_PROCESS_CONCURRENCY: ${MEDIA_PROCESS_CONCURRENCY:-}
  MEDIA_PROCESS_PER_STORE: ${MEDIA_PROCESS_PER_STORE:-}
  MEDIA_CPUS: ${MEDIA_CPUS:-}
  WORKER_MEMORY_LIMIT_MB: ${WORKER_MEMORY_LIMIT_MB:-}
  WORKER_MEMORY_SLOW_PCT: ${WORKER_MEMORY_SLOW_PCT:-}
  WORKER_MEMORY_CRITICAL_PCT: ${WORKER_MEMORY_CRITICAL_PCT:-}
  WORKER_MEMORY_RESUME_PCT: ${WORKER_MEMORY_RESUME_PCT:-}
  WORKER_MEMORY_EXIT_PCT: ${WORKER_MEMORY_EXIT_PCT:-}
  WORKER_MEMORY_EXIT_AFTER_S: ${WORKER_MEMORY_EXIT_AFTER_S:-}
  # Storefront render cache (MB, blank = 48, 0 = off) and how long a CDN may keep a page for
  # visitors without cookies (seconds, blank = 30, 0 = private). See developer docs, performance.
  STOREFRONT_CACHE_MB: ${STOREFRONT_CACHE_MB:-}
  STOREFRONT_EDGE_TTL: ${STOREFRONT_EDGE_TTL:-}
  # Sections of an imported theme's page sent first (blank = 3); the rest stream in behind them.
  STOREFRONT_EAGER_SECTIONS: ${STOREFRONT_EAGER_SECTIONS:-}
  # `off` keeps every store on React pages, whatever their "Send pages as plain HTML" switch.
  STOREFRONT_PLAIN_HTML: ${STOREFRONT_PLAIN_HTML:-}
  # The Bun + Hono product page service (profile `hono`, e.g. http://storefront-hono:3200). Blank
  # sends no page there, whatever each store's delivery.honoProduct switch says.
  STOREFRONT_HONO_URL: ${STOREFRONT_HONO_URL:-}
  STOREFRONT_HONO_TIMEOUT_MS: ${STOREFRONT_HONO_TIMEOUT_MS:-}
  # Branded checkout origin label (security audit D-01 phase B): blank = same-origin checkout
  # (today's behaviour), else checkout serves on <CHECKOUT_SUBDOMAIN>.<store primary host>.
  CHECKOUT_SUBDOMAIN: ${CHECKOUT_SUBDOMAIN:-}
  MERCHANT_SIGNUP_MODE: ${MERCHANT_SIGNUP_MODE:-open}
  # Merchant "Continue with Google" on the admin login page; both blank hides the button.
  MERCHANT_GOOGLE_CLIENT_ID: ${MERCHANT_GOOGLE_CLIENT_ID:-}
  MERCHANT_GOOGLE_CLIENT_SECRET: ${MERCHANT_GOOGLE_CLIENT_SECRET:-}
  REVIEWER_LOGIN_EMAIL: ${REVIEWER_LOGIN_EMAIL:-}
  REVIEWER_LOGIN_PASSWORD: ${REVIEWER_LOGIN_PASSWORD:-}
  # Google Search Console app; blank uses the MERCHANT_GOOGLE_* client.
  GSC_GOOGLE_CLIENT_ID: ${GSC_GOOGLE_CLIENT_ID:-}
  GSC_GOOGLE_CLIENT_SECRET: ${GSC_GOOGLE_CLIENT_SECRET:-}
  # Sales channels: Google Merchant Center client (blank uses MERCHANT_GOOGLE_*) and the Meta app
  # (either blank keeps "Connect" as a request).
  GMC_GOOGLE_CLIENT_ID: ${GMC_GOOGLE_CLIENT_ID:-}
  GMC_GOOGLE_CLIENT_SECRET: ${GMC_GOOGLE_CLIENT_SECRET:-}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  # The Meta app's Login for Business configurations and webhook verify token (integrations/meta).
  META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
  META_WHATSAPP_CONFIG_ID: ${META_WHATSAPP_CONFIG_ID:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  # The Koomerce migration app on Shopify (integrations/shopify); blank hides "Install the app".
  SHOPIFY_APP_CLIENT_ID: ${SHOPIFY_APP_CLIENT_ID:-}
  SHOPIFY_APP_CLIENT_SECRET: ${SHOPIFY_APP_CLIENT_SECRET:-}
  PLATFORM_SALES_STORE_ID: ${PLATFORM_SALES_STORE_ID:-}
  # UPI AutoPay for plans: the platform's own Razorpay account. All three set turns AutoPay on.
  PLATFORM_RAZORPAY_KEY_ID: ${PLATFORM_RAZORPAY_KEY_ID:-}
  PLATFORM_RAZORPAY_KEY_SECRET: ${PLATFORM_RAZORPAY_KEY_SECRET:-}
  PLATFORM_RAZORPAY_WEBHOOK_SECRET: ${PLATFORM_RAZORPAY_WEBHOOK_SECRET:-}
  # Which proxy's client-IP header to believe for per-IP rate limits. `cloudflare` only when the
  # origin is firewalled to Cloudflare's IP ranges (see the deployment runbook); `none` ignores
  # every forwarded header.
  TRUSTED_PROXY: ${TRUSTED_PROXY:-none}
  # Shopper sign-in: the platform login domain and the platform's own provider apps. Unset turns
  # the matching "Continue with …" button off; merchants can still add their own apps.
  ACCOUNTS_URL: ${ACCOUNTS_URL:-}
  SHOPPER_GOOGLE_CLIENT_ID: ${SHOPPER_GOOGLE_CLIENT_ID:-}
  SHOPPER_GOOGLE_CLIENT_SECRET: ${SHOPPER_GOOGLE_CLIENT_SECRET:-}
  SHOPPER_APPLE_SERVICES_ID: ${SHOPPER_APPLE_SERVICES_ID:-}
  SHOPPER_APPLE_TEAM_ID: ${SHOPPER_APPLE_TEAM_ID:-}
  SHOPPER_APPLE_KEY_ID: ${SHOPPER_APPLE_KEY_ID:-}
  SHOPPER_APPLE_PRIVATE_KEY: ${SHOPPER_APPLE_PRIVATE_KEY:-}
  SHOPPER_FACEBOOK_APP_ID: ${SHOPPER_FACEBOOK_APP_ID:-}
  SHOPPER_FACEBOOK_APP_SECRET: ${SHOPPER_FACEBOOK_APP_SECRET:-}
  SHOPPER_TRUECALLER_PARTNER_KEY: ${SHOPPER_TRUECALLER_PARTNER_KEY:-}
  SHOPPER_TRUECALLER_PARTNER_NAME: ${SHOPPER_TRUECALLER_PARTNER_NAME:-}
  RAZORPAY_OAUTH_CLIENT_ID: ${RAZORPAY_OAUTH_CLIENT_ID:-}
  RAZORPAY_OAUTH_CLIENT_SECRET: ${RAZORPAY_OAUTH_CLIENT_SECRET:-}
  R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  SENDER_EMAIL_PROVIDER: ${SENDER_EMAIL_PROVIDER:-dev}
  SENDER_EMAIL_FALLBACK: ${SENDER_EMAIL_FALLBACK:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SES_REGION: ${SES_REGION:-}
  SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID:-}
  SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY:-}
  SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
  SES_EVENTS_TOPIC_ARN: ${SES_EVENTS_TOPIC_ARN:-}
  PLATFORM_EMAIL_FROM: ${PLATFORM_EMAIL_FROM:-}
  PLATFORM_EMAIL_NAME: ${PLATFORM_EMAIL_NAME:-Waimers}
  AI_PROVIDER: ${AI_PROVIDER:-}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_MODEL_STRONG: ${AI_MODEL_STRONG:-}
  AI_MAX_STEPS: ${AI_MAX_STEPS:-}
  AI_UNLIMITED_STORES: ${AI_UNLIMITED_STORES:-}
  # Umami addresses reachable on a private network or over http (our own Umami).
  UMAMI_TRUSTED_ORIGINS: ${UMAMI_TRUSTED_ORIGINS:-}
  MEILISEARCH_TRUSTED_ORIGINS: ${MEILISEARCH_TRUSTED_ORIGINS:-}
  # Chatwoot addresses reachable on a private network or over http (a self-hosted Chatwoot).
  CHATWOOT_TRUSTED_ORIGINS: ${CHATWOOT_TRUSTED_ORIGINS:-}
  # GrowthBook addresses reachable on a private network or over http (our own GrowthBook).
  GROWTHBOOK_TRUSTED_ORIGINS: ${GROWTHBOOK_TRUSTED_ORIGINS:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  # Release-tag Sentry events with the image's commit sha when IMAGE_TAG is pinned; override
  # with SENTRY_RELEASE, or leave both unset.
  SENTRY_RELEASE: ${SENTRY_RELEASE:-${IMAGE_TAG:-}}
  # Structured logs: JSON on stdout always; also shipped over OTLP/HTTP when the endpoint is set.
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  LOG_SAMPLE_RATE: ${LOG_SAMPLE_RATE:-}
  # "Report a bug" button: test server only, off unless set. On needs GITHUB_ISSUES_TOKEN
  # (fine-grained, only Issues: write on GITHUB_ISSUES_REPO) or the apps refuse to start.
  BUG_REPORTS_ENABLED: ${BUG_REPORTS_ENABLED:-false}
  GITHUB_ISSUES_TOKEN: ${GITHUB_ISSUES_TOKEN:-}
  GITHUB_ISSUES_REPO: ${GITHUB_ISSUES_REPO:-}
  # Code repository (fix commits, releases). Differs from GITHUB_ISSUES_REPO: issues are public.
  GITHUB_CODE_REPO: ${GITHUB_CODE_REPO:-}
  # Secret of the GitHub webhook that moves report statuses (My reports). Unset: route off.
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  SOURCE_COMMIT: ${SOURCE_COMMIT:-${IMAGE_TAG:-}}
  # Platform console (/platform): comma-separated staff emails. Blank: nobody can open it.
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
  NODE_ENV: production
  # V8 heap cap, sized under each service's mem_limit (below) so the process fails fast with a
  # clear OOM inside its own container instead of the kernel OOM-killer picking a victim among
  # everything else on the box. admin/storefront (768m limit) get 640; worker overrides this
  # lower in its own environment block (see there for why).
  NODE_OPTIONS: --max-old-space-size=640

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      # Read only by deploy/postgres/init.sh, on first boot of a fresh pgdata volume.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # Tuned for an 8 GB box where Postgres shares the machine with everything else.
      # shared_buffers=1GB is real reserved RAM (mem_limit below covers it plus headroom);
      # effective_cache_size=3GB is only a planner hint about how much of the box's RAM ends
      # up caching Postgres pages (this box's OS page cache, not a Postgres allocation) — it
      # doesn't need its own memory budget line. max_connections is kept low (40) because
      # nothing here uses a per-request connection: admin/storefront/worker each hold one
      # long-lived pool (postgres.js default max 10 connections) — 3 apps x 10 + a few spare
      # for migrate/backup/psql fits comfortably under 40.
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=40
      - -c
      - wal_compression=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1536m
    mem_reservation: 1024m
    networks: [internal]

  # Dragonfly, not Redis (same as docker-compose.yml) — BullMQ needs --cluster_mode=emulated
  # and --lock_on_hashtags. Pinned to a specific version, never `latest`, so a redeploy never
  # silently jumps versions on a stateful store; bump deliberately and test.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    restart: unless-stopped
    command:
      - dragonfly
      - --cluster_mode=emulated
      - --lock_on_hashtags
      - --proactor_threads=2
      - --maxmemory=512mb
      - --dir=/data
      - --dbfilename=dump
      - --snapshot_cron=0 */6 * * *
    volumes:
      - dragonflydata:/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 640m
    mem_reservation: 320m
    networks: [internal]

  # One-shot: runs drizzle migrations against DATABASE_URL_OWNER, then exits 0. Every app
  # service below waits for this to succeed before starting (service_completed_successfully) —
  # see "Deploy order" in apps/docs/content/developer-docs/operations/deployment.mdx.
  migrate:
    # Same image as `backup`, and the one to `docker run` for restore / key rotation (see the
    # runbook). Built from deploy/Dockerfile.tasks by .github/workflows/release.yml.
    image: ghcr.io/viora-tech/tasks:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ['bun', 'run', 'packages/db/src/migrate.ts']
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_OWNER: ${DATABASE_URL_OWNER}
      REDIS_URL: ${REDIS_URL:-redis://dragonfly:6379}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    networks: [internal]

  admin:
    image: ghcr.io/viora-tech/admin:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *app-env
      # Cloudflare custom hostnames API ("Verify connection"). Admin and worker only: the
      # storefront never calls it, so the token stays out of its environment.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:3200/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 768m
    mem_reservation: 384m
    networks: [internal, web]
    deploy:
      # `deploy.update_config` is a Swarm-mode field; Dokploy runs Compose applications through
      # Swarm internally (that's how it gets rolling redeploys at all), so this takes effect
      # there. A plain `docker compose up` outside Dokploy ignores it silently — you'd get the
      # ordinary stop-then-start behaviour instead, briefly dropping traffic. Confirm in
      # Dokploy's UI (Advanced → Rolling update / Zero-downtime, naming varies by version) that
      # it's actually on for this application, since the exact toggle has moved between
      # Dokploy releases.
      update_config:
        order: start-first
        failure_action: rollback
    labels:
      # Dokploy manages Traefik itself; these labels are read the same way whether you paste
      # this compose file into a Dokploy "Compose" application or run it directly with
      # `docker compose`. ADMIN_DOMAIN comes from env, never hardcoded — see
      # deploy/env.production.example.
      - traefik.enable=true
      - traefik.http.routers.commerce-admin.rule=Host(`${ADMIN_DOMAIN}`)
      - traefik.http.routers.commerce-admin.entrypoints=websecure
      - traefik.http.routers.commerce-admin.tls=true
      - traefik.http.routers.commerce-admin.tls.certresolver=letsencrypt
      - traefik.http.services.commerce-admin.loadbalancer.server.port=3200
      # gzip/brotli at the edge — Next already sets far-future Cache-Control on hashed
      # /_next/static assets itself, this only adds compression on top.
      - traefik.http.routers.commerce-admin.middlewares=commerce-compress
      - traefik.http.middlewares.commerce-compress.compress=true

  storefront:
    image: ghcr.io/viora-tech/storefront:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 768m
    mem_reservation: 384m
    networks: [internal, web]
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
    labels:
      - traefik.enable=true
      - traefik.http.routers.commerce-storefront.rule=Host(`${STOREFRONT_DOMAIN}`)
      - traefik.http.routers.commerce-storefront.entrypoints=websecure
      - traefik.http.routers.commerce-storefront.tls=true
      - traefik.http.routers.commerce-storefront.tls.certresolver=letsencrypt
      - traefik.http.services.commerce-storefront.loadbalancer.server.port=3100
      - traefik.http.routers.commerce-storefront.middlewares=commerce-compress
      - traefik.http.middlewares.commerce-compress.compress=true

  # Product pages of the stores switched on (preferences.delivery.honoProduct), drawn by Bun + Hono
  # behind the storefront, which forwards them here only while STOREFRONT_HONO_URL is set and draws
  # the page itself on any failure. Off unless the `hono` profile is enabled: nothing starts, and
  # nothing changes for shoppers, until then. Runbook: docs/research/2026-11-storefront-hono-pilot.md.
  # No Traefik labels: only the storefront reaches it, on the internal network.
  storefront-hono:
    profiles: [hono]
    image: ghcr.io/viora-tech/storefront-hono:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:3200/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Measured locally (12 Nov): about 300 MB at rest, 650 MB peak at 100 users with the render
    # cache on, 790 MB uncached. The same limit as the storefront.
    mem_limit: 768m
    mem_reservation: 384m
    networks: [internal]

  worker:
    image: ghcr.io/viora-tech/worker:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *app-env
      # Bun's heap sizing differs from Node's; --max-old-space-size is honoured on a
      # best-effort basis. 320 leaves headroom under the 384m mem_limit for the queue
      # connections and BullMQ's own buffers, which live outside the JS heap.
      NODE_OPTIONS: --max-old-space-size=320
      # Automatic HTTPS routes for custom domains (Dokploy API). Worker only: the admin and
      # storefront never call Dokploy, so the key stays out of their environment.
      DOKPLOY_URL: ${DOKPLOY_URL:-}
      DOKPLOY_API_KEY: ${DOKPLOY_API_KEY:-}
      DOKPLOY_STOREFRONT_APPLICATION_ID: ${DOKPLOY_STOREFRONT_APPLICATION_ID:-}
      DOKPLOY_STOREFRONT_PORT: ${DOKPLOY_STOREFRONT_PORT:-3100}
      # Cloudflare custom hostnames API (the domain poll and removals). Admin and worker only.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # Cloudflare cache purge after a store's pages change (Zone > Cache Purge). Worker only.
      CLOUDFLARE_CACHE_PURGE_TOKEN: ${CLOUDFLARE_CACHE_PURGE_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 384m
    mem_reservation: 192m
    # At most one CPU: image processing and imports must never take the whole box from the
    # storefront (developer docs, Deployment → CPU for the worker).
    cpus: 1.0
    # `internal` reaches Postgres and Dragonfly; `egress` lets it call payment gateways, couriers,
    # SES and WhatsApp. Nothing on `egress` publishes a port, so it adds no inbound route.
    networks: [internal, egress]
    # No `web`/Traefik labels: the worker's webhook endpoints are reachable only through the
    # storefront/admin's NEXT_PUBLIC_WORKER_URL if you choose to expose them — most stores route
    # payment/shipment webhooks straight to the worker's own domain if needed; add labels here
    # the same way as admin/storefront if you expose it publicly.

  # Nightly encrypted Postgres (+ uploads, if the local storage provider is in use) backup to
  # R2/S3. See "Backups" in apps/docs/content/developer-docs/operations/backups.mdx — on
  # Dokploy, prefer its Scheduled Job feature instead of this always-on service (comment this
  # out if you do).
  backup:
    image: ghcr.io/viora-tech/tasks:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    command: ['sh', '/repo/deploy/backup-cron.sh']
    environment:
      DATABASE_URL_OWNER: ${DATABASE_URL_OWNER}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      BACKUP_R2_ACCOUNT_ID: ${BACKUP_R2_ACCOUNT_ID:-}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:-}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:-}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-03}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    # `egress` for the upload to R2/S3; `internal` for Postgres.
    networks: [internal, egress]

networks:
  # No route out of the host: Postgres, Dragonfly and migrate live only here.
  internal:
    internal: true
  # An ordinary bridge with outbound internet, joined only by the services that must call out
  # and are not on `web` already: worker and backup. admin and storefront go out through `web`.
  egress:
    driver: bridge
  web:
    # Dokploy creates and attaches its own Traefik network to every app it manages, named
    # `dokploy-network` by default — confirm the exact name for your install with
    # `docker network ls` and override DOKPLOY_NETWORK if it differs. Running this compose
    # file directly (no Dokploy) instead, create it yourself first:
    # `docker network create ${DOKPLOY_NETWORK:-dokploy-network}` and put your own reverse
    # proxy on it, or drop the `web` network and Traefik labels entirely and publish ports.
    name: ${DOKPLOY_NETWORK:-dokploy-network}
    external: true

volumes:
  pgdata:
  dragonflydata:
