[workspace]
members = [".", "bench/measure"]
resolver = "2"

[package]
name = "image-worker"
version = "0.1.0"
edition = "2021"
description = "Upload-time image pipeline (pilot): the Rust port of packages/core/src/media/pipeline.ts"
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "image-worker"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
fast_image_resize = { version = "5", default-features = false }
ravif = { version = "0.13", default-features = false, features = ["asm"] }
webp = { version = "0.3", default-features = false }
mozjpeg = { version = "0.10", default-features = false, features = ["nasm_simd"] }
thumbhash = "0.1"
base64 = "0.22"

[profile.release]
lto = false
codegen-units = 16
debug = false
strip = true
