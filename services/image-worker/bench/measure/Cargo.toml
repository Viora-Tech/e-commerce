[package]
name = "measure"
version = "0.1.0"
edition = "2021"
description = "Run a command and report wall time, CPU time and peak memory (bench helper)"
license = "UNLICENSED"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
